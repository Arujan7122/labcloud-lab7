services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: "postgresql+psycopg://labcloud:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/labcloud"
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: labcloud
      POSTGRES_USER: labcloud
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - labcloud-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labcloud -d labcloud"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No host port for PostgreSQL. Only web is reachable from localhost.
volumes:
  labcloud-pg:
